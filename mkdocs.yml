site_name: ASSO 3TT
site_description: Materiały do przedmiotu administracja sieciowymi systemami operacyjnymi — klasa 3TT, technik teleinformatyk, kwalifikacja INF.07
site_author: PCEiKZ Szczucin

# Adres docelowy strony. Przy GitHub Pages dla repozytorium projektowego
# ma postać https://<użytkownik>.github.io/<nazwa-repo>/ — zmień, jeśli
# nazwiesz repozytorium inaczej albo podepniesz własną domenę.
site_url: https://josimate.github.io/asso/

# Włącza w nagłówku odnośnik do repozytorium i przycisk "Edytuj tę stronę".
repo_url: https://github.com/JosiMate/asso
repo_name: JosiMate/asso
edit_uri: edit/main/docs/
copyright: PCEiKZ Szczucin — materiały do użytku edukacyjnego

theme:
  name: material
  language: pl
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  palette:
    # Dwa stany: ciemny (domyślny) i jasny. Wpisu „zgodny z systemem" tu nie ma
    # celowo — Material rozpoznaje ustawienie systemu tylko wtedy, gdy pozostałe
    # wpisy mają media „(prefers-color-scheme: light)" i „(prefers-color-scheme:
    # dark)". Wtedy jednak to system decyduje o motywie startowym i nie da się
    # jednocześnie wymusić ciemnego jako domyślnego. Wybrany został ciemny
    # domyślny, więc przełącznik ma dwa położenia i nie może się zablokować.
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb jasny
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb ciemny
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra_css:
  # Kolejność ma znaczenie: najpierw style elementów interaktywnych,
  # potem warstwa wyglądu powłoki dokumentacji, na końcu kolory serwisu.
  - assets/extra.css
  - stylesheets/extra.css
  - stylesheets/motyw.css

extra_javascript:
  # docx.umd.js celowo NIE jest tu wymieniony — karta.js doczyta go dopiero
  # przy generowaniu pliku, żeby nie obciążać czytelników materiału.
  - assets/js/karta.js
  - assets/js/quiz.js
  - assets/js/postep.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Odnośnik do tej sekcji
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Ikony Material/Octicons zapisywane jako :material-nazwa: — bez tego
  # rozszerzenia shortcode'y zostają w tekście jako goły napis.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  # Wyszukiwarka lunr nie ma polskiego stemmera (biblioteka lunr-languages
  # nie wspiera polskiego), więc świadomie zostawiamy tokenizer domyślny.
  - search

